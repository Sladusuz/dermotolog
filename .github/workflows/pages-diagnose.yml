name: Pages diagnose
# Vaqtinchalik: GitHub Pages sertifikat holatini chop etadi va HTTPS'ni yoqib ko'radi.
on: workflow_dispatch
permissions:
  contents: read
  pages: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Pages site info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "== /pages (before) =="
          gh api repos/${{ github.repository }}/pages || echo "pages call failed"
          echo
          echo "== try enable HTTPS =="
          gh api -X PUT repos/${{ github.repository }}/pages -F https_enforced=true -f cname=dr-zohid.uz || echo "enable https failed"
          echo
          echo "== /pages (after) =="
          gh api repos/${{ github.repository }}/pages || echo "pages call failed"
